name: Secure DevSecOps Release Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.1.1

      - name: Secrets Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SAST & Vulnerability Scan (Trivy FS)
        uses: aquasecurity/trivy-action@0.18.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1' # Blocks release on High/Critical findings

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.2.0

      - name: Build Docker Image locally for Scanning
        run: |
          docker build -t axiler/api-service:test ./app

      - name: Container Image Vulnerability Scan
        uses: aquasecurity/trivy-action@0.18.0
        with:
          image-ref: 'axiler/api-service:test'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Generate Software Bill of Materials (SBOM)
        uses: anchore/sbom-action@v0.15.10
        with:
          image: axiler/api-service:test
          format: cyclonedx-json
          output-file: app-sbom.cyclonedx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.4.0

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Immutable Image Digest
        if: github.ref == 'refs/heads/main'
        id: build-push
        uses: docker/build-push-action@v5.3.0
        with:
          context: ./app
          push: true
          tags: ghcr.io/${{ github.repository }}/api-service:${{ github.sha }}

      - name: Sign Container Image (Cosign)
        if: github.ref == 'refs/heads/main'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/api-service@${{ steps.build-push.outputs.digest }}
